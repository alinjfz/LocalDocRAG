name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Run test suite ──────────────────────────────────────────────────────────
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB:       localdocrag_test
          POSTGRES_USER:     localdocrag_user
          POSTGRES_PASSWORD: test_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          # Auth
          APP_USERNAME:        testadmin
          # bcrypt hash of "localdocrag_test_pass_123" — generated by passlib in conftest.py
          APP_PASSWORD_HASH:   ""
          JWT_SECRET_KEY:      "ci-test-secret-key-minimum-32-characters!!"
          JWT_EXPIRE_MINUTES:  "60"
          # LLM — tests mock all LLM calls, so provider/key don't matter
          LLM_PROVIDER:        ollama
          OPENAI_API_KEY:      "ci-not-real"
          OLLAMA_BASE_URL:     "http://localhost:11434"
          OLLAMA_LLM_MODEL:    "llama3.2:3b"
          OLLAMA_EMBED_MODEL:  "nomic-embed-text"
          # Database — real PostgreSQL service above
          DATABASE_URL:        "postgresql+psycopg://localdocrag_user:test_secret@localhost:5432/localdocrag_test"
          # Pipeline — small values for fast tests
          CHUNK_SIZE:          "200"
          CHUNK_OVERLAP:       "20"
          TOP_K_RETRIEVAL:     "3"
          MAX_FILE_SIZE_MB:    "5"
          EMBEDDING_DIMENSION: "4"
          ALLOWED_ORIGINS:     "http://localhost:5173"
        run: pytest tests/ -v --tb=short

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.9

      - name: Run ruff
        run: ruff check backend/app/

  # ── Build Docker images ──────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build ./backend -t localdocrag-backend:${{ github.sha }} --no-cache

      - name: Build frontend image
        run: docker build ./frontend -t localdocrag-frontend:${{ github.sha }} --no-cache

      - name: Build nginx image
        run: docker build ./nginx -t localdocrag-nginx:${{ github.sha }} --no-cache

      - name: Build success
        run: |
          echo "✅ All 3 Docker images built successfully"
          echo "   localdocrag-backend:${{ github.sha }}"
          echo "   localdocrag-frontend:${{ github.sha }}"
          echo "   localdocrag-nginx:${{ github.sha }}"
          echo "Ready to tag and push to your container registry."
