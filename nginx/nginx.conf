worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting zones
    # General API: 30 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;
    # LLM query endpoint: 10 requests/minute per IP (expensive operations)
    limit_req_zone $binary_remote_addr zone=llm_zone:10m rate=10r/m;

    # Upstream services (internal Docker network)
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    # ─── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS server ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Self-signed certificate (generated in nginx/Dockerfile)
        ssl_certificate     /etc/nginx/ssl/docmind.crt;
        ssl_certificate_key /etc/nginx/ssl/docmind.key;

        # Modern SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options              DENY                                always;
        add_header X-Content-Type-Options       nosniff                             always;
        add_header X-XSS-Protection             "1; mode=block"                     always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin"   always;
        add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy           "geolocation=(), microphone=()"     always;

        # Allow large file uploads (must be >= MAX_FILE_SIZE_MB in .env)
        client_max_body_size 25M;

        # ── LLM query endpoint (strict rate limit) ──────────────────────────
        location = /api/query/ {
            limit_req zone=llm_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        # ── All other API endpoints ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=15 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # ── Frontend (React SPA) ─────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # ── Custom error pages ───────────────────────────────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            add_header Content-Type application/json always;
            return 429 '{"detail":"Too many requests. Please slow down.","status_code":429}';
        }
    }
}
