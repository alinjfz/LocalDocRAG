# ─────────────────────────────────────────────────────────────────────────────
# LocalDocRAG — Test Compose File
# Use this to run the test suite locally with a real PostgreSQL instance.
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   cd backend && DATABASE_URL=postgresql+psycopg://localdocrag_user:test_secret@localhost:5433/localdocrag_test pytest tests/ -v
#   docker-compose -f docker-compose.test.yml down
# ─────────────────────────────────────────────────────────────────────────────

services:

  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB:       localdocrag_test
      POSTGRES_USER:     localdocrag_user
      POSTGRES_PASSWORD: test_secret
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5433:5432"   # Different host port to avoid conflicting with main db
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localdocrag_user -d localdocrag_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
