server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defence-in-depth — nginx reverse proxy also sets these)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Serve React SPA: all unknown routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite fingerprints them)
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access logs for health checks
    location = /health {
        access_log off;
        return 200 "ok";
    }
}
